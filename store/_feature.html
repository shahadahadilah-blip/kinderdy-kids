<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:-apple-system,'Plus Jakarta Sans',sans-serif}
.bg{position:relative;width:1024px;height:500px;background:linear-gradient(120deg,#170A4A 0%,#2A1670 45%,#0B2C5A 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.b1{width:420px;height:420px;background:#7C5CFF;top:-120px;right:-60px}
.b2{width:360px;height:360px;background:#22D3EE;bottom:-140px;left:-80px}
.content{position:relative;height:100%;display:flex;align-items:center;gap:40px;padding:0 64px;color:#fff}
h1{margin:0;font-size:74px;letter-spacing:-1px;line-height:1;font-weight:800}
.k{background:linear-gradient(180deg,#fff,#C9B8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.kids{display:block;font-size:38px;letter-spacing:12px;color:#FFC93C;margin-top:6px}
p{margin:18px 0 0;font-size:24px;opacity:.9}
.badges{display:flex;gap:12px;margin-top:26px}
.badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:10px 18px;border-radius:999px;font-size:16px;font-weight:700}
</style></head><body><div class="bg"><span class="blob b1"></span><span class="blob b2"></span>
